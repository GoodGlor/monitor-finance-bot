[project]
name = "monitor-finance"
version = "0.1.0"
description = "Bank-email to Google Sheets expense tracker with LLM categorization and a Telegram tagging bot."
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "google-api-python-client>=2.194.0",
    "google-auth-httplib2>=0.3.1",
    "google-auth-oauthlib>=1.3.1",
    "protobuf>=7.34.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
